<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KBS1944 聲音鑰匙圈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* KBS1944 聲音鑰匙圈：手機單頁，沿用放送局海報黃綠配色 */
:root{
  --ink:#141414; --yellow:#F4D03A; --lime:#A8CC1E; --green:#4E9A2F; --green-d:#3D7F22;
  --paper:#FDF7DA; --card:#FFFFFF; --line:#D6D3C4; --muted:#5E5A4E; --gray:#C8C8C8; --err:#A33A2A;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.7 'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;padding-bottom:env(safe-area-inset-bottom,0px)}
:lang(ja) body{font-family:'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--green-d);outline-offset:2px}
.page{max-width:480px;margin:0 auto}
.stripe{display:flex;height:12px}.stripe i{flex:1}
.hd{background:var(--yellow);padding:16px max(20px,env(safe-area-inset-right,0px)) 22px max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px}
.lang{display:flex;gap:2px;align-self:flex-end;background:rgba(20,20,20,.08);border-radius:99px;padding:3px}
.lang button{min-width:44px;min-height:36px;border:none;border-radius:99px;background:transparent;font-size:13px;font-weight:700;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--yellow)}
.eyebrow{font-size:13px;font-weight:500}
h1{margin:0;font-weight:900;font-size:30px;line-height:1.2;text-wrap:balance}
.hd p{margin:0;font-size:15px}
.tag{display:inline-flex;align-self:flex-start;font-size:13px;font-weight:700;background:var(--ink);color:var(--yellow);padding:2px 10px;border-radius:99px;font-variant-numeric:tabular-nums}
main{padding:20px max(20px,env(safe-area-inset-right,0px)) 24px max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
.stack{display:flex;flex-direction:column;gap:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:10px;border:none;background:var(--green-d);color:#fff;font-weight:700;font-size:17px;cursor:pointer;width:100%;padding:0 14px;text-align:center}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink);font-weight:500;font-size:15px;min-height:46px}
.btn.dark{background:var(--ink)}
.btn.danger{background:transparent;color:var(--err);border:1.5px solid var(--err);font-weight:500;font-size:15px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.hint{font-size:13px;color:var(--muted);margin:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.panel h2{margin:0;font-size:18px;font-weight:900}
.rules{font-size:13px;color:var(--muted);background:var(--paper);border-radius:8px;padding:10px 12px 10px 28px;margin:0}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.6;cursor:pointer}
.chk input{width:22px;height:22px;margin-top:1px;accent-color:var(--green-d);flex:none}
.pin{display:flex;gap:8px}
.pin input{width:54px;height:58px;text-align:center;font-size:24px;font-weight:700;border:1.5px solid var(--line);border-radius:8px;background:#fff}
.pin input.one{width:150px;letter-spacing:10px}
.pin input:focus{border-color:var(--green-d)}
.err{color:var(--err);font-size:14px;margin:0}
.notice{background:#fff;border:1.5px solid var(--err);border-radius:10px;padding:12px 14px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.notice ol{margin:0;padding-left:20px}
.rec{display:flex;flex-direction:column;align-items:center;gap:16px;padding:6px 0}
.clock{font-weight:900;font-size:44px;font-variant-numeric:tabular-nums;line-height:1}
.clock small{font-size:16px;color:var(--muted);font-weight:500}
.meter{display:flex;gap:4px;align-items:center;height:56px}
.meter i{width:6px;border-radius:3px;background:var(--gray);height:8px}
.recording .meter i{background:var(--green)}
.recbtn{width:96px;height:96px;border-radius:50%;border:6px solid var(--ink);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
.recbtn span{width:44px;height:44px;border-radius:50%;background:#D23A2A;transition:all .15s}
.recording .recbtn span{width:34px;height:34px;border-radius:6px}
.upload{display:flex;align-items:center;justify-content:center;min-height:44px;font-size:14px;text-decoration:underline;cursor:pointer;color:var(--ink)}
.upload input{position:absolute;width:1px;height:1px;opacity:0}
.player{background:var(--yellow);border-radius:14px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.reels{display:flex;gap:22px}
.reel{width:88px;height:88px;border-radius:50%;background:var(--green);position:relative;display:flex;align-items:center;justify-content:center}
.reel::before{content:'';width:18px;height:18px;border-radius:50%;background:var(--yellow)}
.reel i{position:absolute;width:22px;height:22px;border-radius:50%;background:#2B3A2A}
.reel i:nth-child(1){top:13px;left:33px}.reel i:nth-child(2){bottom:17px;left:15px}.reel i:nth-child(3){bottom:17px;right:15px}
.spin .reel{animation:r 3s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
.play{width:72px;height:72px;border-radius:50%;border:none;background:var(--ink);color:var(--yellow);font-size:28px;cursor:pointer}
.play:disabled{opacity:.4;cursor:wait}
.prog{width:100%;max-width:260px;height:6px;border-radius:99px;background:rgba(20,20,20,.12);overflow:hidden}.prog span{display:block;height:100%;width:0;background:var(--ink)}
.busy{display:flex;align-items:center;justify-content:center;gap:10px;padding:24px 0;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--green);animation:p 1s ease-in-out infinite}
@keyframes p{50%{opacity:.25}}
.route{display:flex;flex-direction:column}
.route h2{margin:0 0 4px;font-size:18px;font-weight:900}
.site{display:grid;grid-template-columns:64px minmax(0,1fr);gap:0 12px;position:relative;padding-bottom:18px}
.site:last-child{padding-bottom:0}
.site::before{content:'';position:absolute;left:31px;top:30px;bottom:0;width:2px;background:var(--ink)}
.site:last-child::before{display:none}
.yr{width:64px;height:30px;border-radius:99px;background:var(--ink);color:var(--yellow);font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;position:relative;z-index:1}
.site.here .yr{background:var(--green-d);color:#fff}
.site h3{margin:2px 0;font-size:17px;font-weight:900}
.site p{margin:0;font-size:14px;line-height:1.7}
.site .addr{font-size:12px;color:var(--muted);margin-top:4px}
footer{padding:16px 20px 24px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
@media(prefers-reduced-motion:reduce){.spin .reel,.dot{animation:none}.recbtn span{transition:none}}
</style>
</head>
<body>
<div class="page">
  <div class="stripe" aria-hidden="true"><i style="background:#A8CC1E"></i><i style="background:#fff"></i><i style="background:#4E9A2F"></i><i style="background:#C8C8C8"></i><i style="background:#141414"></i><i style="background:#fff"></i><i style="background:#A8CC1E"></i><i style="background:#4E9A2F"></i></div>
  <header class="hd">
    <div class="lang" role="group" aria-label="Language 語言"><button type="button" data-lang="zh">中</button><button type="button" data-lang="en">EN</button><button type="button" data-lang="ja">日</button></div>
    <span class="eyebrow" data-i="eyebrow"></span>
    <h1 id="hdTitle"></h1>
    <p id="hdSub"></p>
    <span class="tag" id="tag" hidden></span>
  </header>

  <main>
    <div class="busy" id="vLoading"><span class="dot"></span><span data-i="loading"></span></div>
    <div class="notice" id="vError" hidden><b id="errTitle"></b><span id="errBody"></span></div>

    <!-- 未錄音 -->
    <section id="vStart" class="stack" hidden>
      <button class="btn" type="button" id="toConsent" data-i="recordBtn"></button>
      <button class="btn ghost" type="button" data-scroll data-i="browse"></button>
      <p class="hint" data-i="startHint"></p>
    </section>

    <!-- 同意與密碼 -->
    <section id="vConsent" class="panel" hidden>
      <h2 data-i="consentH"></h2>
      <ul class="rules"><li data-i="rule1"></li><li data-i="rule2"></li><li data-i="rule3"></li></ul>
      <p class="hint" style="font-weight:700;color:var(--ink)" data-i="minor"></p>
      <label class="chk"><input type="checkbox" id="agree"><span data-i="agree"></span></label>
      <label class="chk"><input type="checkbox" id="exhibit"><span data-i="exhibit"></span></label>
      <div class="stack" id="pinSet" style="gap:6px">
        <span style="font-size:14px;font-weight:700" data-i="pinH"></span>
        <span class="hint" data-i="pinHint"></span>
        <div class="pin"><input inputmode="numeric" maxlength="1" id="p1" autocomplete="off"><input inputmode="numeric" maxlength="1" id="p2" autocomplete="off"><input inputmode="numeric" maxlength="1" id="p3" autocomplete="off"><input inputmode="numeric" maxlength="1" id="p4" autocomplete="off"></div>
      </div>
      <p class="err" id="cErr" hidden></p>
      <button class="btn" type="button" id="toRec" data-i="next"></button>
      <button class="btn ghost" type="button" id="backStart" data-i="back"></button>
    </section>

    <!-- 錄音 -->
    <section id="vRec" class="panel" hidden>
      <h2 data-i="recH"></h2>
      <p class="hint" data-i="recTip"></p>
      <div class="notice" id="micHelp" hidden></div>
      <div class="rec" id="recBox">
        <div class="clock" id="clock">0:00 <small>/ 1:00</small></div>
        <div class="meter" id="meter" aria-hidden="true"></div>
        <button class="recbtn" type="button" id="recBtn"><span></span></button>
        <span class="hint" id="recHint"></span>
      </div>
      <label class="upload"><input type="file" id="upFile" accept="audio/*,.m4a,.mp3,.aac,.wav"><span data-i="uploadAlt"></span></label>
    </section>

    <!-- 試聽確認 -->
    <section id="vReview" class="panel" hidden>
      <h2 data-i="reviewH"></h2>
      <div class="player" id="pv1">
        <div class="reels" aria-hidden="true"><div class="reel"><i></i><i></i><i></i></div><div class="reel"><i></i><i></i><i></i></div></div>
        <button class="play" type="button" id="reviewPlay">▶</button>
        <span style="font-size:14px" id="reviewLen"></span>
      </div>
      <p class="err" id="sErr" hidden></p>
      <button class="btn" type="button" id="save" data-i="save"></button>
      <button class="btn ghost" type="button" id="redo" data-i="redo"></button>
    </section>

    <!-- 已錄音 -->
    <section id="vPlay" class="stack" hidden>
      <div class="player" id="pv2">
        <span style="font-size:14px;font-weight:700" id="savedMsg" data-i="saved" hidden></span>
        <div class="reels" aria-hidden="true"><div class="reel"><i></i><i></i><i></i></div><div class="reel"><i></i><i></i><i></i></div></div>
        <button class="play" type="button" id="mainPlay" disabled>▶</button>
        <div class="prog"><span id="mainProg"></span></div>
        <span style="font-size:14px" id="recDate"></span>
      </div>
      <button class="btn ghost" type="button" id="toPin" data-i="toPin"></button>
      <div class="panel" id="pinBox" hidden>
        <span style="font-size:14px;font-weight:700" data-i="pinAsk"></span>
        <div class="pin"><input class="one" inputmode="numeric" maxlength="4" id="pinAll" autocomplete="off"></div>
        <p class="err" id="pErr" hidden></p>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
          <button class="btn dark" type="button" id="pinRedo" data-i="redo"></button>
          <button class="btn danger" type="button" id="pinDel" data-i="del" style="min-height:52px"></button>
        </div>
        <p class="err" id="delAsk" hidden data-i="delAsk"></p>
      </div>
    </section>

    <!-- 廊道三館 -->
    <section class="route" id="route" aria-labelledby="routeH">
      <h2 id="routeH" data-i="routeH"></h2>
      <p class="hint" style="margin:0 0 14px" data-i="routeHint"></p>
      <div class="site"><span class="yr">1936</span><div><h3 data-i="s1n"></h3><p data-i="s1"></p><p class="addr" data-i="s1a"></p></div></div>
      <div class="site"><span class="yr">1942</span><div><h3 data-i="s2n"></h3><p data-i="s2"></p><p class="addr" data-i="s2a"></p></div></div>
      <div class="site here"><span class="yr">1944</span><div><h3 data-i="s3n"></h3><p data-i="s3"></p><p class="addr" data-i="s3a"></p></div></div>
    </section>
  </main>
  <footer><span data-i="ft"></span></footer>
  <audio id="au" preload="auto" hidden></audio>
</div>

  /* ---------- 狀態 ---------- */
  const code = (new URLSearchParams(location.search).get('c') || '').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 12);
  const S = { mode: code ? 'loading' : 'home', no: '', recordedAt: '', pin: '', rerecord: false, blob: null, mime: '', seconds: 0, deleted: false, errKey: '' };
  const pickLang = () => { try { const v = localStorage.getItem('kbsLang'); if (I18N[v]) return v; } catch (e) {} const n = (navigator.language || 'zh').toLowerCase(); return n.startsWith('zh') ? 'zh' : n.startsWith('ja') ? 'ja' : 'en'; };
  let lang = pickLang();
  const t = (k, v) => String(I18N[lang][k] || '').replace(/\{(\w)\}/g, (m, x) => (v && v[x] != null ? v[x] : ''));
  const VIEWS = ['vLoading', 'vError', 'vStart', 'vConsent', 'vRec', 'vReview', 'vPlay'];
  let view = code ? 'vLoading' : '';
  function show(v) { view = v; VIEWS.forEach(id => { $('#' + id).hidden = id !== v; }); head(); if (v && v !== 'vStart' && v !== 'vLoading') $('main').scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  function head() {
    let ti = 'title0', su = 'sub0';
    if (!code) { ti = 'titleHome'; su = 'subHome'; }
    else if (view === 'vPlay') { ti = 'title1'; su = 'sub1'; }
    else if (S.deleted) su = 'subDel';
    $('#hdTitle').innerHTML = t(ti); $('#hdSub').textContent = t(su);
    $('#tag').hidden = !S.no; $('#tag').textContent = t('tag', { n: S.no });
  }
  function fmt(s) { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
  function fmtDate(str) {
    const m = String(str).match(/(\d{4})-(\d{2})-(\d{2})/); if (!m) return '';
    const y = +m[1], mo = +m[2], d = +m[3];
    if (lang === 'zh') return `${y - 1911} 年 ${mo} 月 ${d} 日`;
    if (lang === 'ja') return `${y}年${mo}月${d}日`;
    return `${d} ${['January','February','March','April','May','June','July','August','September','October','November','December'][mo - 1]} ${y}`;
  }
  function applyLang() {
    document.documentElement.lang = lang === 'zh' ? 'zh-Hant' : lang;
    document.querySelectorAll('[data-i]').forEach(el => { el.innerHTML = t(el.dataset.i); });
    document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
    head();
    $('#recHint').textContent = rec ? t('recOn') : t('recIdle');
    $('#recBtn').setAttribute('aria-label', rec ? t('recStop') : t('recStart'));
    $('#reviewLen').textContent = t('len') + ' ' + fmt(S.seconds);
    $('#recDate').textContent = S.recordedAt ? t('recDate', { d: fmtDate(S.recordedAt) }) : '';
    ['#reviewPlay', '#mainPlay'].forEach(s => $(s).setAttribute('aria-label', t('play')));
    if (S.errKey) showError(S.errKey);
    if (!$('#micHelp').hidden) $('#micHelp').innerHTML = t($('#micHelp').dataset.k);
  }
  document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => { lang = b.dataset.lang; try { localStorage.setItem('kbsLang', lang); } catch (e) {} applyLang(); }));
  function showError(k) { S.errKey = k; $('#errTitle').textContent = t(k); $('#errBody').textContent = t(k + 'B'); show('vError'); }

  /* ---------- 連線 ---------- */
  async function apiGet(action) {
    const r = await fetch(`${GAS_URL}?action=${action}&c=${encodeURIComponent(code)}`, { cache: 'no-store' });
    return r.json();
  }
  async function apiPost(body) {
    const r = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(Object.assign({ c: code }, body)) });   // text/plain，不觸發預檢
    return r.json();
  }
  const errMsg = e => (e === 'busy' ? t('eBusy') : e === 'network' ? t('eNet') : t('eServer'));

  /* ---------- 播放 ---------- */
  const au = $('#au');
  let playingBtn = null, playerBox = null;
  function setAudio(blob) { if (au.src) URL.revokeObjectURL(au.src); au.src = URL.createObjectURL(blob); au.load(); }
  function b64ToBlob(b64, mime) { const bin = atob(b64), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new Blob([u], { type: mime }); }
  async function loadSaved() {
    $('#mainPlay').disabled = true;
    try { const r = await apiGet('audio'); if (r.ok) { setAudio(b64ToBlob(r.data, r.mime)); $('#mainPlay').disabled = false; } }
    catch (e) { /* 播放鍵維持停用；重新整理即可 */ }
  }
  function togglePlay(btn, box) {
    if (!au.paused && playingBtn === btn) { au.pause(); return; }
    playingBtn = btn; playerBox = box;
    au.currentTime = 0; au.play().catch(() => {});
  }
  au.onplay = () => { if (playerBox) playerBox.classList.add('spin'); if (playingBtn) { playingBtn.textContent = '❚❚'; playingBtn.setAttribute('aria-label', t('stop')); } };
  au.onpause = au.onended = () => { if (playerBox) playerBox.classList.remove('spin'); if (playingBtn) { playingBtn.textContent = '▶'; playingBtn.setAttribute('aria-label', t('play')); } $('#mainProg').style.width = '0'; };
  au.ontimeupdate = () => { if (au.duration && playingBtn === $('#mainPlay')) $('#mainProg').style.width = (au.currentTime / au.duration * 100) + '%'; };
  $('#reviewPlay').onclick = () => togglePlay($('#reviewPlay'), $('#pv1'));
  $('#mainPlay').onclick = () => togglePlay($('#mainPlay'), $('#pv2'));

  /* ---------- 首次與同意 ---------- */
  document.addEventListener('click', e => { if (e.target.closest('[data-scroll]')) $('#route').scrollIntoView({ behavior: 'smooth' }); });
  $('#toConsent').onclick = () => { S.rerecord = false; $('#pinSet').hidden = false; $('#cErr').hidden = true; show('vConsent'); };
  $('#backStart').onclick = () => { stopRec(true); show(S.rerecord ? 'vPlay' : 'vStart'); };
  const pins = ['#p1', '#p2', '#p3', '#p4'].map(s => $(s));
  pins.forEach((el, i) => {
    el.addEventListener('input', () => { el.value = el.value.replace(/\D/g, '').slice(-1); if (el.value && pins[i + 1]) pins[i + 1].focus(); });
    el.addEventListener('keydown', e => { if (e.key === 'Backspace' && !el.value && pins[i - 1]) pins[i - 1].focus(); });
  });
  $('#toRec').onclick = () => {
    const pin = S.rerecord ? S.pin : pins.map(p => p.value).join('');
    const err = !$('#agree').checked ? t('errAgree') : !/^\d{4}$/.test(pin) ? t('errPin') : '';
    $('#cErr').hidden = !err; $('#cErr').textContent = err;
    if (err) return;
    S.pin = pin; resetRec(); show('vRec');
  };

  /* ---------- 錄音 ---------- */
  const meter = $('#meter'); meter.innerHTML = '<i></i>'.repeat(22);
  const bars = [...meter.children];
  let rec = null, stream = null, chunks = [], t0 = 0, tick = null, actx = null, analyser = null;
  function pickMime() {
    if (!window.MediaRecorder) return '';
    return ['audio/mp4', 'audio/mp4;codecs=mp4a.40.2', 'audio/aac', 'audio/webm;codecs=opus', 'audio/webm'].find(m => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) || '';
  }
  function micHelp(k) { const h = $('#micHelp'); h.dataset.k = k; h.innerHTML = t(k); h.hidden = false; }
  function resetRec() {
    clearInterval(tick); tick = null; $('#recBox').classList.remove('recording');
    $('#clock').innerHTML = '0:00 <small>/ 1:00</small>'; bars.forEach(b => { b.style.height = '8px'; });
    $('#recHint').textContent = t('recIdle'); $('#recBtn').setAttribute('aria-label', t('recStart'));
    $('#micHelp').hidden = true;
  }
  function stopRec(discard) {
    if (rec && rec.state !== 'inactive') { rec.discard = !!discard; rec.stop(); }
    clearInterval(tick); tick = null;
  }
  async function startRec() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) { micHelp('noMic'); return; }
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } }); }
    catch (e) { micHelp('micDenied'); return; }
    $('#micHelp').hidden = true;
    const mime = pickMime();
    try { rec = new MediaRecorder(stream, Object.assign({ audioBitsPerSecond: 64000 }, mime ? { mimeType: mime } : {})); }
    catch (e) { rec = new MediaRecorder(stream); }
    chunks = [];
    rec.ondataavailable = ev => { if (ev.data && ev.data.size) chunks.push(ev.data); };
    rec.onstop = () => {
      stream.getTracks().forEach(tr => tr.stop());
      if (actx) { try { actx.close(); } catch (e) {} actx = null; }
      const secs = (Date.now() - t0) / 1000;
      const discard = rec.discard; const type = (rec.mimeType || mime || 'audio/mp4').split(';')[0];
      rec = null; resetRec();
      if (discard || !chunks.length) return;
      S.blob = new Blob(chunks, { type }); S.mime = type; S.seconds = Math.min(secs, MAX_SECONDS);
      setAudio(S.blob); $('#reviewLen').textContent = t('len') + ' ' + fmt(S.seconds); $('#sErr').hidden = true;
      show('vReview');
    };
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); analyser = actx.createAnalyser(); analyser.fftSize = 64; actx.createMediaStreamSource(stream).connect(analyser); } catch (e) { analyser = null; }
    rec.start(1000); t0 = Date.now();
    $('#recBox').classList.add('recording'); $('#recHint').textContent = t('recOn'); $('#recBtn').setAttribute('aria-label', t('recStop'));
    const buf = analyser ? new Uint8Array(analyser.frequencyBinCount) : null;
    tick = setInterval(() => {
      const s = (Date.now() - t0) / 1000;
      $('#clock').innerHTML = fmt(s) + ' <small>/ 1:00</small>';
      if (buf) { analyser.getByteFrequencyData(buf); bars.forEach((b, i) => { b.style.height = (8 + (buf[i % buf.length] / 255) * 48) + 'px'; }); }
      if (s >= MAX_SECONDS) stopRec(false);
    }, 90);
  }
  $('#recBtn').onclick = () => { if (rec) stopRec(false); else startRec(); };

  // 上傳錄音檔（備案）
  $('#upFile').addEventListener('change', e => {
    const f = e.target.files[0]; e.target.value = '';
    if (!f) return;
    const ext = (f.name.split('.').pop() || '').toLowerCase();
    const type = f.type || { m4a: 'audio/mp4', mp3: 'audio/mpeg', aac: 'audio/aac', wav: 'audio/wav' }[ext] || '';
    if (!type || f.size > MAX_BYTES) { micHelp('badFile'); return; }
    const probe = new Audio(); probe.preload = 'metadata';
    probe.onloadedmetadata = () => {
      const d = probe.duration; URL.revokeObjectURL(probe.src);
      if (isFinite(d) && d > MAX_SECONDS + 2) { micHelp('badFile'); return; }
      S.blob = f; S.mime = type === 'audio/x-m4a' ? 'audio/mp4' : type; S.seconds = isFinite(d) ? d : 0;
      setAudio(f); $('#reviewLen').textContent = t('len') + ' ' + fmt(S.seconds); $('#sErr').hidden = true; show('vReview');
    };
    probe.onerror = () => { micHelp('badFile'); };
    probe.src = URL.createObjectURL(f);
  });

  /* ---------- 保存 ---------- */
  $('#redo').onclick = () => { au.pause(); resetRec(); show('vRec'); };
  $('#save').onclick = async () => {
    au.pause();
    const btn = $('#save'); btn.disabled = true; btn.textContent = t('saving'); $('#sErr').hidden = true;
    try {
      const data = await new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = no; r.readAsDataURL(S.blob); });
      const res = await apiPost({ action: 'save', pin: S.pin, agree: true, exhibit: $('#exhibit').checked, mime: S.mime, seconds: S.seconds, data: data, lang: lang });
      if (!res.ok) {
        if (res.error === 'locked') throw new Error(t('pinLocked', { m: res.minutes }));
        if (res.error === 'pin') throw new Error(t('pinBad', { n: res.left }));
        if (res.error === 'size' || res.error === 'format') throw new Error(t('badFile'));
        throw new Error(errMsg(res.error));
      }
      S.recordedAt = res.recordedAt; S.deleted = false; S.rerecord = false;
      $('#recDate').textContent = t('recDate', { d: fmtDate(S.recordedAt) });
      $('#savedMsg').hidden = false; $('#mainPlay').disabled = false; $('#pinBox').hidden = true;
      show('vPlay');
    } catch (e) { $('#sErr').hidden = false; $('#sErr').textContent = e.message && e.message !== 'Failed to fetch' ? e.message : t('eNet'); }
    finally { btn.disabled = false; btn.textContent = t('save'); }
  };

  /* ---------- 重錄、刪除 ---------- */
  let delArmed = false;
  $('#toPin').onclick = () => { const b = $('#pinBox'); b.hidden = !b.hidden; $('#pinAll').value = ''; $('#pErr').hidden = true; $('#delAsk').hidden = true; delArmed = false; if (!b.hidden) $('#pinAll').focus(); };
  function pinErr(res) { $('#pErr').hidden = false; $('#pErr').textContent = res.error === 'locked' ? t('pinLocked', { m: res.minutes }) : res.error === 'pin' ? t('pinBad', { n: res.left }) : errMsg(res.error); }
  $('#pinRedo').onclick = async () => {
    const pin = $('#pinAll').value.trim(); if (!/^\d{4}$/.test(pin)) { $('#pErr').hidden = false; $('#pErr').textContent = t('errPin'); return; }
    const btn = $('#pinRedo'); btn.disabled = true;
    try {
      const res = await apiPost({ action: 'verify', pin: pin });
      if (!res.ok) { pinErr(res); return; }
      au.pause(); S.pin = pin; S.rerecord = true; $('#pinSet').hidden = true; $('#cErr').hidden = true; $('#agree').checked = false; show('vConsent');
    } catch (e) { pinErr({ error: 'network' }); } finally { btn.disabled = false; }
  };
  $('#pinDel').onclick = async () => {
    const pin = $('#pinAll').value.trim(); if (!/^\d{4}$/.test(pin)) { $('#pErr').hidden = false; $('#pErr').textContent = t('errPin'); return; }
    $('#pErr').hidden = true;
    if (!delArmed) { delArmed = true; $('#delAsk').hidden = false; return; }
    const btn = $('#pinDel'); btn.disabled = true;
    try {
      const res = await apiPost({ action: 'delete', pin: pin });
      if (!res.ok) { pinErr(res); delArmed = false; $('#delAsk').hidden = true; return; }
      au.pause(); au.removeAttribute('src'); delArmed = false; $('#delAsk').hidden = true; $('#pinBox').hidden = true;
      S.deleted = true; S.recordedAt = ''; S.pin = ''; pins.forEach(p => { p.value = ''; }); $('#agree').checked = false; $('#exhibit').checked = false;
      show('vStart');
    } catch (e) { pinErr({ error: 'network' }); } finally { btn.disabled = false; }
  };

  /* ---------- 啟動 ---------- */
  applyLang();
  if (!code) { VIEWS.forEach(id => { $('#' + id).hidden = true; }); head(); return; }
  apiGet('get').then(r => {
    if (!r.ok) { showError(r.error === 'notfound' ? 'eNotFound' : 'eNotFound'); return; }
    S.no = r.no; head();
    if (r.status === 'removed') { showError('eRemoved'); return; }
    if (r.status === 'recorded') { S.recordedAt = r.recordedAt; $('#recDate').textContent = t('recDate', { d: fmtDate(r.recordedAt) }); show('vPlay'); loadSaved(); return; }
    show('vStart');
  }).catch(() => { $('#errTitle').textContent = t('eNet'); $('#errBody').textContent = ''; show('vError'); });
})();
</script>
</body>
</html>
